name: Cross-platform Desktop

on:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "tunbridge-desktop-v*"
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  desktop-contract:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: ubuntu-24.04-x64
            os: ubuntu-24.04
          - platform: macos-arm64
            os: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-features

      # --all-features enables the development bootstrap; the distributed
      # helper feature set must compile on its own as well.
      - name: Check production macOS helper features
        if: runner.os == 'macOS'
        run: >-
          cargo check -p tunbridge-service-macos --bin tunbridge-helper-macos
          --features macos-helper-scaffold,macos-xpc-listener

      - name: Lint Desktop contract
        run: cargo clippy -p tunbridge-desktop -p tunbridge-desktop-contract --all-features -- -D warnings

      - name: Test Desktop contract
        run: cargo test -p tunbridge-desktop -p tunbridge-desktop-contract --all-features

      - name: Install UI dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Test UI
        working-directory: apps/desktop
        run: npm test

      - name: Build UI
        working-directory: apps/desktop
        run: npm run build

      - name: Verify unified product version
        working-directory: apps/desktop
        run: npm run check:version-sync

      - name: Verify unified release tag
        working-directory: apps/desktop
        run: npm run check:release-tag

      - name: Test unified release manifest
        working-directory: apps/desktop
        run: npm run test:release-manifest

      - name: Verify Windows Setup contract
        working-directory: apps/desktop
        run: npm run check:windows-setup

      - name: Verify Omarchy package contract
        if: runner.os == 'Linux'
        run: ./scripts/check-linux-desktop-omarchy.sh

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y

      - name: Compile Windows Setup smoke fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/build-windows-setup-smoke.ps1

      - name: Reject development mock data from release surface
        working-directory: apps/desktop
        run: npm run check:release-surface
