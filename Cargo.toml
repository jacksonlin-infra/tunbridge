[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/tunbridge-core",
    "crates/tunbridge-cli",
    "crates/tunbridge-desktop-contract",
    "crates/tunbridge-service",
    "crates/tunbridge-setup",
    "platforms/windows/crates/tunbridge-platform-windows",
    "platforms/windows/crates/tunbridge-service-windows",
    "platforms/windows/crates/tunbridge-setup-windows",
    "platforms/linux/crates/tunbridge-platform-linux",
    "platforms/linux/crates/tunbridge-service-linux",
    "platforms/linux/crates/tunbridge-setup-linux",
    "platforms/macos/crates/tunbridge-platform-macos",
    "platforms/macos/crates/tunbridge-service-macos",
    "platforms/macos/crates/tunbridge-setup-macos",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
thiserror = "2"
tauri = { version = "2", default-features = false, features = ["wry", "tray-icon"] }
clap = { version = "4", features = ["derive"] }
assert_cmd = "2"
predicates = "3"
zeroize = "1"
sha2 = "0.10"
flate2 = "1.1.9"
semver = "1"
libc = "0.2"
block2 = "0.6.2"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

# Build scripts and proc-macros only (never shipped). Release builds strip
# debug info by default, and Xcode 27's strip corrupts dylibs linked for
# macOS 12+ (chained fixups): dyld then refuses to load the proc-macros with
# "mis-aligned LINKEDIT string pool". Shipped binaries keep the default.
[profile.release.build-override]
strip = "none"
